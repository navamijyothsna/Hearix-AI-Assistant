<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hearix</title>
    <meta name="description" content="AI voice assistant for visually impaired engineering students to read PDF notes.">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>

<body>
    <main id="app-container" tabindex="0" aria-label="Tap anywhere on the screen to start speaking">
        <div id="controls" onclick="event.stopPropagation()">
            <label class="switch-container">
                <input type="checkbox" id="exact-notes-toggle">
                <span class="slider"></span>
                <span class="label-text">Exact Notes</span>
            </label>
        </div>
        <h1 id="status-text" aria-live="polite">Tap anywhere to speak</h1>
        <p id="feedback-text" aria-live="polite"></p>
    </main>
    <script src="app.js"></script>
</body>

</html>
